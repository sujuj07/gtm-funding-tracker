name: fetch-global-funding-intelligence

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: startup-intelligence-funding
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Fail before writing rather than after. Every case in these tests is a
      # value that actually reached the sheet and corrupted a column.
      - name: Verify validators
        run: |
          python tests/test_validate.py
          python tests/test_scoring.py
          python tests/test_sec_form_d.py
      - name: Run funding intelligence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_MODEL_FALLBACKS: "qwen/qwen3.8-27b,openai/gpt-oss-120b"
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          DEFILLAMA_API_KEY: ${{ secrets.DEFILLAMA_API_KEY }}
          MAX_ITEMS_PER_RUN: "25"
        run: python main.py
