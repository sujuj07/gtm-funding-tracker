name: backfill-funding-intelligence

on:
  # Daily catch-up; each run uses the current date as the exclusive end date.
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: startup-intelligence-funding-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backfill from August 1, 2026 to today
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          DEFILLAMA_API_KEY: ${{ secrets.DEFILLAMA_API_KEY }}
          BACKFILL_DATE_FROM: "2026-08-01"
          BACKFILL_MAX_ITEMS_PER_RUN: ${{ github.event_name == 'schedule' && '20' || '60' }}
        run: python backfill.py
