name: backfill-crypto-launch-radar

on:
  # Stagger an hourly launch-history pass, with strict-source quality checks.
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      reset_cursor:
        description: "Restart from 2026-08-01; already processed source URLs remain deduplicated"
        required: false
        default: false
        type: boolean
      recheck_processed_sources:
        description: "One-time re-evaluation of previously processed crypto launch sources (use with reset_cursor)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: startup-intelligence-crypto-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reset historical cursor when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_cursor }}
        shell: bash
        run: |
          mkdir -p .backfill-state
          rm -f .backfill-state/crypto.json
          echo "Reset crypto backfill cursor; next run starts at 2026-08-01. Processed source URLs remain deduplicated in Apps Script."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Process the next crypto-launch history window
        id: backfill
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GROQ_MODEL_FALLBACKS: "openai/gpt-oss-20b,openai/gpt-oss-120b"
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          BACKFILL_DATE_FROM: "2026-08-01"
          BACKFILL_WINDOW_DAYS: "7"
          BACKFILL_MAX_ITEMS_PER_RUN: ${{ github.event_name == 'schedule' && '6' || '8' }}
          BACKFILL_RECHECK_PROCESSED_SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.recheck_processed_sources && 'true' || 'false' }}
        run: python backfill_crypto.py
      - name: Persist cursor on the default branch
        if: ${{ always() && (success() || (github.event_name == 'workflow_dispatch' && inputs.reset_cursor)) }}
        shell: bash
        run: |
          mkdir -p .backfill-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .backfill-state
          if git diff --cached --quiet; then
            echo "No cursor change to commit (window may still be processing remaining candidates)."
            exit 0
          fi
          git commit -m "chore(backfill): advance crypto history cursor"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Disable this schedule once crypto history reaches today
        if: steps.backfill.outputs.caught_up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/backfill-crypto.yml/disable"
